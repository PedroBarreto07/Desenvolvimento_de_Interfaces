<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tutorial 12 - CRUD de Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestão de Produtos (Inventário)</h1>
            <nav class="menu">
                <button onclick="navegar('listar')">📦 Listar Produtos</button>
                <button onclick="navegar('incluir')">➕ Incluir Novo</button>
            </nav>
        </header>

        <section id="tela-incluir" class="tela" style="display:none;">
            <h2 id="titulo-form">Cadastrar Novo Produto</h2>
            <input type="hidden" id="produto-id">

            <div class="form-grupo">
                <label>Nome:</label>
                <input type="text" id="nome" placeholder="Ex: Arroz 5kg">

                <label>Quantidade:</label>
                <input type="number" id="quantidade" placeholder="0">

                <label>Preço Unitário:</label>
                <input type="number" id="valor" placeholder="0.00">

                <button id="btn-salvar" class="btn-principal" onclick="salvar()">Salvar Produto</button>
                <button onclick="navegar('listar')">Cancelar</button>
            </div>
        </section>

        <section id="tela-listar" class="tela">
            <h2>Produtos em Estoque</h2>
            <div id="grid-produtos" class="grid-produtos"></div>
        </section>

        <div id="status-api"></div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
